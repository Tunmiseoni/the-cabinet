name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            exe: echo-cart
          - os: macos-latest
            platform: macos-aarch64
            exe: echo-cart
          - os: windows-latest
            platform: windows-x86_64
            exe: echo-cart.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            build-essential \
            curl wget file patchelf

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Install JS dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Build frontend
        run: npm run build

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --workspace

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Prove the installed helper (Linux)
        if: matrix.os == 'ubuntu-22.04'
        working-directory: src-tauri
        run: |
          cargo build --bin cabinet-helper
          cp /etc/hosts "$RUNNER_TEMP/hosts.before"
          sudo target/debug/cabinet-helper install --uid "$(id -u)"
          systemctl is-active com.the-cabinet.helper.service
          sudo ufw --force enable
          CABINET_EXPECT_UFW=1 cargo test --workspace -- --ignored --test-threads=1 the_installed_helper_
          sudo /usr/local/libexec/the-cabinet/com.the-cabinet.helper uninstall
          if sudo ufw status | grep tailscale0; then exit 1; fi
          if ls /usr/local/share/ca-certificates/the-cabinet-* 2>/dev/null; then exit 1; fi
          diff "$RUNNER_TEMP/hosts.before" /etc/hosts
          test ! -e /etc/systemd/system/com.the-cabinet.helper.service
          test ! -e /usr/local/libexec/the-cabinet
          test ! -e /var/lib/com.the-cabinet.helper
          test ! -e /run/com.the-cabinet.helper.sock

      - name: Prove the installed helper (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: src-tauri
        shell: pwsh
        run: |
          function Run { & $args[0] $args[1..($args.Length - 1)]; if ($LASTEXITCODE -ne 0) { throw "$($args -join ' ') failed with $LASTEXITCODE" } }
          Run cargo build --bin cabinet-helper
          $password = ConvertTo-SecureString ("Cab-" + [guid]::NewGuid().ToString() + "-1a") -AsPlainText -Force
          New-LocalUser -Name cabinet-standard -Password $password -AccountNeverExpires | Out-Null
          Add-LocalGroupMember -Group Users -Member cabinet-standard -ErrorAction SilentlyContinue
          if (Get-LocalGroupMember Administrators | Where-Object Name -like '*\cabinet-standard') { throw "the test user is an administrator" }
          $credential = [pscredential]::new("$env:COMPUTERNAME\cabinet-standard", $password)
          $public = Join-Path $env:PUBLIC cabinet-bind
          New-Item -ItemType Directory -Force $public | Out-Null
          Copy-Item target\debug\echo-cart.exe $public
          $bind = Start-Process -FilePath (Join-Path $public echo-cart.exe) -ArgumentList 'bind', '989' -Credential $credential -WorkingDirectory $public -Wait -PassThru
          Remove-LocalUser -Name cabinet-standard
          Remove-Item -Recurse -Force $public
          if ($bind.ExitCode -ne 0) { throw "a standard user could not bind port 989 (exit code $($bind.ExitCode))" }
          Write-Output "a standard user bound port 989"
          $hosts = "$env:SystemRoot\System32\drivers\etc\hosts"
          $before = (Get-FileHash $hosts).Hash
          $sid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          Run target\debug\cabinet-helper.exe install --sid $sid
          Run target\debug\cabinet-helper.exe install --sid $sid
          if ((Get-Service com.the-cabinet.helper).Status -ne 'Running') { throw "the service is not running" }
          Get-CimInstance Win32_Service -Filter "Name='com.the-cabinet.helper'" | Format-List Name, StartName, StartMode, PathName
          Run cargo test --workspace '--' --ignored --test-threads=1 the_installed_helper_
          Get-Command openssl | Format-List Source
          Run cargo test --workspace '--' --ignored --test-threads=1 the_user_store_trusts_
          Run target\debug\cabinet-helper.exe uninstall
          if (Get-Service com.the-cabinet.helper -ErrorAction SilentlyContinue) { throw "the service is still there" }
          if (Test-Path "$env:ProgramFiles\The Cabinet Helper") { throw "the program folder is still there" }
          if (Test-Path "$env:ProgramData\com.the-cabinet.helper") { throw "the journal folder is still there" }
          if ([System.IO.Directory]::GetFiles("\\.\pipe\") -contains "\\.\pipe\com.the-cabinet.helper") { throw "the pipe is still there" }
          if ((Get-FileHash $hosts).Hash -ne $before) { throw "the hosts file changed" }
          if (Get-NetFirewallRule -DisplayName 'The Cabinet *' -ErrorAction SilentlyContinue) { throw "a firewall rule is left" }

      - name: Build echo-cart
        working-directory: src-tauri
        run: cargo build --release -p echo-cart

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: echo-cart-${{ matrix.platform }}
          path: src-tauri/target/release/${{ matrix.exe }}
          if-no-files-found: error

  test-cartridge:
    name: pack the test cartridge
    needs: check
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: echo-cart-*
          path: builds

      - name: Pack and sign with a throwaway key
        run: |
          mkdir -p stage
          cp cartridges/test/cartridge.toml stage/
          for platform in linux-x86_64 macos-aarch64 windows-x86_64; do
            mkdir -p "stage/files/$platform"
            cp builds/echo-cart-$platform/* "stage/files/$platform/"
          done
          cd src-tauri
          cargo build --release -p cabinet-cartridge --bin cabinet-pack
          pack=target/release/cabinet-pack
          keys="$RUNNER_TEMP/keys"
          mkdir -p "$keys"
          "$pack" keygen "$keys/throwaway.key" "$keys/throwaway.pub"
          "$pack" pack ../stage --out ../test-0.1.0.cart --key "$keys/throwaway.key"
          "$pack" inspect ../test-0.1.0.cart

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-cartridge
          path: test-0.1.0.cart
          if-no-files-found: error
