name: Smoke

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: ubuntu-22.04
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            build-essential \
            curl wget file patchelf \
            xvfb imagemagick

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install JS dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Build (debug, no bundle)
        run: npm run tauri build -- --debug --no-bundle

      - name: Smoke launch (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p shots
          xvfb-run -a -s "-screen 0 1280x800x24" bash -c '
            set -uo pipefail
            ./src-tauri/target/debug/the-cabinet >/tmp/app.log 2>&1 &
            pid=$!
            sleep 12
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "app exited early"; cat /tmp/app.log; exit 1
            fi
            import -window root shots/linux.png || true
            kill "$pid" 2>/dev/null || true
          '

      - name: Smoke launch (macOS)
        if: matrix.platform == 'macos-latest'
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p shots
          ./src-tauri/target/debug/the-cabinet >/tmp/app.log 2>&1 &
          pid=$!
          sleep 12
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "app exited early"; cat /tmp/app.log; exit 1
          fi
          screencapture -x shots/macos.png || true
          kill "$pid" 2>/dev/null || true

      - name: Smoke launch (Windows)
        if: matrix.platform == 'windows-latest'
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path shots | Out-Null
          $bin = "src-tauri\target\debug\the-cabinet.exe"
          $p = Start-Process -FilePath $bin -PassThru -RedirectStandardOutput app.out -RedirectStandardError app.err
          Start-Sleep -Seconds 12
          if ($p.HasExited) {
            Get-Content app.out, app.err -ErrorAction SilentlyContinue
            throw "app exited early"
          }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save("shots\windows.png")
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ matrix.platform }}
          path: shots/
          if-no-files-found: ignore
          retention-days: 7
