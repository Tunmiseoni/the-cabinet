[package]
name = "the-cabinet"
version = "0.1.15"
description = "Multi-game session coordinator over Tailscale"
authors = ["The Cabinet contributors"]
edition = "2021"
default-run = "the-cabinet"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["cartridge", "helper", "../cartridges/test"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "the_cabinet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cabinet-cartridge = { path = "cartridge" }
cabinet-helper = { path = "helper" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
log = "0.4.34"
tauri-plugin-log = "2.9.2"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
ureq = "3"
tiny_http = "0.12.0"
tokio = { version = "1", features = ["sync", "time"] }
tokio-util = "0.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_UI_Shell"] }


[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
echo-cart = { path = "../cartridges/test" }

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.2.0"
core-foundation = "0.10.1"
core-graphics = "0.25.0"
