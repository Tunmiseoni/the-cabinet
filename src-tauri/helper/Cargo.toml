[package]
name = "cabinet-helper"
version = "0.1.0"
description = "The Cabinet's privileged helper: a fixed menu of journaled system changes"
authors = ["The Cabinet contributors"]
edition = "2021"
publish = false

[lib]
name = "cabinet_helper"

[dependencies]
cabinet-cartridge = { path = "../cartridge" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
